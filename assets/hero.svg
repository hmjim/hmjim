      .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #8b949e; }
      .badge { fill: #161b22; stroke: #30363d; stroke-width: 1px; }
